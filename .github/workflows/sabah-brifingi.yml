# Sabah Finans Brifingi — bulutta (GitHub Actions) çalışır; Mac'e bağlı değildir.
#
#  Tetikleme (birincil): cron-job.org dakikası dakikasına "workflow_dispatch" gönderir
#     Hafta içi 07:15 TSİ  → mode=sabah-zamanlamasi (hazırla → sesi yayımla → 08:15'te gönder)
#     Her gün 18:30, 23:50 → mode=kap-kopyasi
#  Tetikleme (yedek): aşağıdaki GitHub zamanlayıcısı. GitHub yoğunlukta işleri saatlerce geciktirebildiği için
#     yalnızca yedektir; o gün bülten zaten gönderildiyse (gh-pages'teki durum/<tarih>.gonderildi) hiçbir şey yapmaz.
#  Elle ("Run workflow"): hemen-gonder = beklemeden çalıştırıp gönder (test için)
#                         deneme       = beklemeden çalıştır; e-posta GÖNDERME, ses yayımlama (kayıtları kontrol için)
#
# Gerekli Secrets: GEMINI_API_KEY, SMTP_USER (Gmail adresi), SMTP_PASSWORD (Google uygulama şifresi)
# İsteğe bağlı Secret: SUBSCRIBERS (virgülle; boşsa SMTP_USER'a gönderilir)
# Türkiye UTC+3 (yaz saati yok) → cron saatleri UTC'dir.
name: Sabah Finans Brifingi

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 07:15 TSİ — sabah bülteni (yedek)
    - cron: "30 15 * * *"    # 18:30 TSİ — KAP akşam kopyası (yedek)
    - cron: "50 20 * * *"    # 23:50 TSİ — KAP gece kopyası (yedek)
  workflow_dispatch:
    inputs:
      mode:
        description: "Ne çalışsın?"
        type: choice
        options: [hemen-gonder, deneme, sabah-zamanlamasi, kap-kopyasi]
        default: hemen-gonder

permissions:
  contents: write            # ses dosyalarını ve gönderim işaretini gh-pages dalına yazmak için

# Sabah bülteni hangi yoldan tetiklenirse tetiklensin aynı gruptadır: ikinci tetikleme sıraya girer,
# başladığında günün işaretini görür ve atlar (çift e-posta olmaz).
concurrency:
  group: >-
    brifing-${{ (github.event.schedule == '15 4 * * 1-5' || inputs.mode == 'sabah-zamanlamasi') && 'sabah'
    || github.event.schedule || inputs.mode }}
  cancel-in-progress: false

env:
  TZ: Europe/Istanbul
  PYTHONUNBUFFERED: "1"
  LLM_PROVIDER: gemini
  VIDEO_PROVIDER: gemini
  EMAIL_PROVIDER: smtp
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"

jobs:
  brifing:
    runs-on: ubuntu-24.04     # sabit sürüm: ubuntu-latest geçişlerinden etkilenmez
    timeout-minutes: 100
    steps:
      - name: Çalışma türünü belirle
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "15 4 * * 1-5" ]; then m="sabah-zamanlamasi"
          else m="kap-kopyasi"; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Çalışma türü: $m (tetikleyen: ${{ github.event_name }})"

      - uses: actions/checkout@v4

      # ---------------- Bülten: yayın dalı + günlük gönderim işareti ----------------
      - name: Yayın dalını hazırla (gh-pages)
        if: steps.mode.outputs.mode != 'kap-kopyasi'
        run: |
          git config --global user.name "sabah-brifingi-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "MEDIA_PUBLISH_DIR=$PWD/site" >> "$GITHUB_ENV"
          echo "MEDIA_PUBLIC_BASE_URL=https://${owner}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Bugün gönderildi mi?
        id: gate
        run: |
          marker="site/durum/$(date +%F).gonderildi"
          if [ "${{ steps.mode.outputs.mode }}" = "sabah-zamanlamasi" ] && [ -f "$marker" ]; then
            echo "Bugünün bülteni zaten gönderilmiş ($(cat "$marker")) — bu çalışma atlanıyor."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        if: steps.gate.outputs.go == 'true'
        run: pip install -q -r requirements.txt

      - name: KAP önbelleğini geri yükle
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/_kap_cache
          key: kap-${{ github.run_id }}
          restore-keys: kap-

      # ---------------- KAP kopyası ----------------
      - name: KAP kopyası al
        if: steps.mode.outputs.mode == 'kap-kopyasi'
        run: python -m agents.kap_source --snapshot

      # ---------------- Bülten ----------------
      - name: Yazı tipleri (video görseli)
        if: steps.mode.outputs.mode != 'kap-kopyasi' && steps.gate.outputs.go == 'true'
        run: sudo apt-get install -y -qq fonts-dejavu-core > /dev/null

      - name: Hazırla (bülten, ses, video)
        if: steps.mode.outputs.mode != 'kap-kopyasi' && steps.gate.outputs.go == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python main.py --now --prepare-only
          ${{ (steps.mode.outputs.mode == 'hemen-gonder' || steps.mode.outputs.mode == 'deneme') && '--no-wait' || '' }}
          ${{ steps.mode.outputs.mode == 'sabah-zamanlamasi' && '--if-business-day' || '' }}

      - name: Sesi yayımla (GitHub Pages)
        if: >-
          steps.mode.outputs.mode != 'kap-kopyasi' && steps.mode.outputs.mode != 'deneme'
          && steps.gate.outputs.go == 'true'
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then echo "Yayımlanacak yeni ses yok"; exit 0; fi
          git commit -q -m "Sesli brifing: $(date +%F)"
          git pull -q --rebase origin gh-pages || true
          git push -q origin gh-pages

      - name: Gönder (08:15)
        if: steps.mode.outputs.mode != 'kap-kopyasi' && steps.gate.outputs.go == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: Sabah Brifingi <${{ secrets.SMTP_USER }}>
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS || secrets.SMTP_USER }}
        run: >-
          python main.py --dispatch-only
          ${{ (steps.mode.outputs.mode == 'hemen-gonder' || steps.mode.outputs.mode == 'deneme') && '--no-wait' || '' }}
          ${{ steps.mode.outputs.mode == 'deneme' && '--dry-run' || '' }}
          ${{ steps.mode.outputs.mode == 'sabah-zamanlamasi' && '--if-business-day' || '' }}

      - name: Gönderim işaretini yaz
        if: >-
          success() && steps.mode.outputs.mode == 'sabah-zamanlamasi' && steps.gate.outputs.go == 'true'
        run: |
          report="output/$(date +%F)/run_report.json"
          if ! python -c "import json,sys; r=json.load(open('$report')); sys.exit(0 if r.get('dispatch',{}).get('sent') else 1)" 2>/dev/null; then
            echo "Gönderim yapılmadı (ör. resmi tatil) — işaret yazılmadı."; exit 0
          fi
          mkdir -p site/durum
          echo "$(date '+%F %H:%M') · ${{ github.event_name }} · run ${{ github.run_id }}" > "site/durum/$(date +%F).gonderildi"
          find site/durum -name '*.gonderildi' -mtime +30 -delete
          cd site
          git add -A
          git commit -q -m "Gönderildi: $(date +%F)"
          git pull -q --rebase origin gh-pages || true
          git push -q origin gh-pages

      # ---------------- Ortak ----------------
      - name: KAP önbelleğini kaydet
        if: always() && steps.gate.outputs.go != 'false'
        uses: actions/cache/save@v4
        with:
          path: output/_kap_cache
          key: kap-${{ github.run_id }}

      - name: Çıktıları sakla (7 gün)
        if: always() && steps.mode.outputs.mode != 'kap-kopyasi' && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brifing-${{ github.run_id }}
          path: |
            output/*/briefing.html
            output/*/briefing.json
            output/*/run_report.json
            output/*/teleprompter.txt
          retention-days: 7
          if-no-files-found: ignore

      # GitHub, 60 gün hiç işlem olmayan herkese açık depolarda zamanlanmış işleri durdurur.
      - name: Zamanlamayı canlı tut
        if: steps.mode.outputs.mode == 'sabah-zamanlamasi'
        run: |
          last=$(git log -1 --format=%ct HEAD)
          if [ "$last" -lt $(( $(date +%s) - 50*86400 )) ]; then
            git commit -q --allow-empty -m "Zamanlama canlı tutma"
            git push -q origin HEAD
          fi
